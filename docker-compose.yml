services:

  mysql:

    image: mysql:8.4

    container_name: hodsm-mysql

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: hodsm_db

    ports:

      - "3307:3306"

    volumes:

      - mysql-data:/var/lib/mysql

  hodsm-app:

    build: .

    container_name: hodsm-app

    restart: always

    depends_on:

      - mysql

    ports:

      - "8080:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hodsm_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root

volumes:

  mysql-data: